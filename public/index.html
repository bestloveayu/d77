<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#215e50"><meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com https://fonts.googleapis.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com https://*.workers.dev; img-src 'self' data: https://lh3.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>東77 · 雲端管理</title>
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&amp;display=swap">
  <link rel="stylesheet" href="./typography.css">
  <link rel="stylesheet" href="./mobile.css">
  <link rel="stylesheet" href="./overview.css">
  <link rel="stylesheet" href="./inventory.css?v=20261101.14">
  <script src="./config.js"></script><script defer src="./assets/lucide.min.js"></script>
  <link rel="stylesheet" href="./push.css?v=20261101.12">
  <link rel="stylesheet" href="./swipe.css?v=20261101.15">
  <link rel="stylesheet" href="./order-followup.css?v=20261101.16">
  <link rel="stylesheet" href="./transactions.css?v=20261102.4">
  <script type="module" src="./app.js?v=20261102.4"></script>
</head>
<body>
  <header class="masthead"><div class="masthead-inner">
    <a class="brand" href="#overview" aria-label="東77 總覽">東<span>77</span></a>
    <div class="header-tools"><button id="theme" class="icon-button" title="切換日夜模式" aria-label="切換日夜模式"><i data-lucide="moon"></i></button><button id="settings" class="icon-button" title="通知與帳號設定" aria-label="通知與帳號設定"><i data-lucide="settings-2"></i></button></div>
  </div></header>
  <main id="main">
    <section id="login" class="login-panel">
      <p class="eyebrow">東77 CLOUD</p><h1>雲端管理</h1><p class="muted">登入查看訂單、庫存與規則進度。</p>
      <div id="google-login"></div><label class="field"><span>在此裝置保持登入 30 天</span><input id="remember-login" type="checkbox"></label><p class="muted">共用或公用裝置請勿勾選。</p><p id="login-status" class="notice" role="status"></p>
      <p class="privacy"><i data-lucide="shield-check"></i>僅授權成員可讀取正式資料</p>
    </section>
    <section id="workspace" hidden>
      <div class="page-heading"><div><p class="eyebrow">雲端工作區 <span id="demo-label" class="demo-label" hidden>示意資料</span></p><h1 id="page-title">營運總覽</h1></div><label class="season-switcher"><select id="season-select" aria-label="查看季別"><option value="">未設定季別</option></select></label></div>
      <div class="sync-line"><span id="sync-status" role="status">尚未讀取</span><button id="refresh" class="icon-button" title="重新讀取雲端" aria-label="重新讀取雲端"><i data-lucide="refresh-cw"></i></button></div>
      <div id="error" class="error-banner" hidden role="alert"></div>
      <div id="view"></div>
      <p class="footnote">東77 雲端管理 <span id="version">0.6.1</span> · 唯讀</p>
    </section>
  </main>
  <nav id="nav" class="bottom-nav" aria-label="主要導覽" hidden>
    <a href="#overview" data-page="overview"><i data-lucide="house"></i><span>總覽</span></a>
    <a href="#orders" data-page="orders"><i data-lucide="clipboard-list"></i><span>訂單</span></a>
    <a href="#inventory" data-page="inventory"><i data-lucide="package"></i><span>庫存</span></a>
    <a href="#rules" data-page="rules"><i data-lucide="book-open"></i><span>規則</span></a>
    <a href="#transactions" data-page="transactions"><i data-lucide="chart-no-axes-combined"></i><span>收支</span></a>
  </nav>
  <dialog id="detail"><div class="dialog-heading"><h2 id="detail-title"></h2><button id="detail-close" class="icon-button" aria-label="關閉" title="關閉"><i data-lucide="x"></i></button></div><div id="detail-body"></div></dialog>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body></html>
